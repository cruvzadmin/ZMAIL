# Dovecot Mail Location Configuration

# Mail location
mail_location = maildir:/var/mail/vhosts/%d/%n

# Namespace configuration
namespace inbox {
  inbox = yes
  
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  
  mailbox Spam {
    special_use = \Junk
    auto = subscribe
  }
  
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# Mail user and group
mail_uid = vmail
mail_gid = vmail

# Mail access groups
mail_access_groups = vmail

# Mailbox privileges
mail_privileged_group = vmail
